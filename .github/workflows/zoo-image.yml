name: Build ZooTV image

# TheZoo-House fork: publishes the patched build to ghcr.io/thezoo-house/tunarr.
# Tag a commit zoo-v<upstream version>-zoo.<n>, for example zoo-v2026.9.1-zoo.1.
on:
  push:
    tags:
      - zoo-v*

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Version
        run: |
          echo "TUNARR_VERSION=${GITHUB_REF_NAME#zoo-v}" >> $GITHUB_ENV
          echo "TUNARR_BUILD=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          target: full-stack
          build-args: |
            base_image_tag=7.1.1
            tunarr_version=${{ env.TUNARR_VERSION }}
            tunarr_build=${{ env.TUNARR_BUILD }}
            exec_target=linux-x64
          tags: ghcr.io/thezoo-house/tunarr:${{ env.TUNARR_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/TheZoo-House/tunarr
          cache-from: type=gha
          cache-to: type=gha,mode=max
